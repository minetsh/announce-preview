    <title>Announce · 受保护的预览</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f2f2f7;
        --paper: #ffffff;
        --ink: #202031;

        --line: #e2e2eb;
        --brand: #5759df;
        --brand-soft: #eeeeff;

      }

      * { box-sizing: border-box; }

      .staticrypt-html,
      .staticrypt-body { min-height: 100%; }

      .staticrypt-body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .hidden { display: none !important; }

      .staticrypt-spinner-container {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .staticrypt-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--line);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      .staticrypt-content {
        min-height: 100vh;
        padding: 24px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .access-header,
      .access-footer {
        width: min(100%, 1080px);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        font-size: 12px;
      }

      .access-header {
        min-height: 72px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        margin: 0;
        color: var(--ink);
        font-size: 18px;
        font-weight: 750;
      }

      .access-state,
      .access-footer { color: var(--muted); }

      .access-state {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .access-state::before {
        width: 7px;
        height: 7px;
        background: var(--brand);
        border-radius: 50%;
        box-shadow: 0 3px 10px rgba(87, 89, 223, 0.35);
        content: "";
      }

      .staticrypt-page {
        width: min(100%, 1080px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 0.72fr);
        align-items: center;
        gap: clamp(40px, 8vw, 116px);
      }

      .context-copy { max-width: 560px; }

      .eyebrow {
        margin: 0;
        color: var(--brand);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .context-copy h1 {
        margin: 20px 0 22px;
        font-size: clamp(3rem, 6vw, 5.5rem);
        line-height: 1.05;
        text-wrap: balance;
      }

      .context-copy h1 span {
        display: block;
        color: var(--brand);
      }

      .context-copy > p:last-child {
        max-width: 38em;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.85;
      }

      .staticrypt-form {
        padding: 42px 40px 38px;
        border-top: 3px solid var(--brand);
        background: var(--paper);
        box-shadow: 0 18px 60px rgba(16, 16, 30, 0.14);
      }

      .staticrypt-title {
        margin: 0;
        font-size: 24px;
        font-weight: 750;
      }

      .staticrypt-instructions {
        margin: 10px 0 30px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }

      .staticrypt-password-container {
        display: grid;
        grid-template-columns: 1fr auto;
        border: 1px solid var(--line);
        background: var(--canvas);
      }

      .staticrypt-password-container:focus-within {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(87, 89, 223, 0.15);
      }

      #staticrypt-password {
        min-width: 0;
        padding: 14px 16px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 16px;
      }

      #staticrypt-password::placeholder { color: #838399; }

      .staticrypt-toggle-password-visibility {
        padding: 0 15px;
        border: 0;
        background: transparent;
        color: var(--brand);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      .staticrypt-decrypt-button {
        width: 100%;
        margin-top: 14px;
        padding: 14px 18px;
        border: 1px solid var(--brand);
        background: var(--brand);
        color: var(--paper);
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 7px 20px rgba(87, 89, 223, 0.24);
      }

      .staticrypt-decrypt-button:hover { background: var(--ink); border-color: var(--ink); }

      .staticrypt-toggle-password-visibility:focus-visible,
      .staticrypt-decrypt-button:focus-visible,
      #staticrypt-password:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }

      .staticrypt-remember {
        margin: 16px 0 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .staticrypt-error {
        margin: 14px 0 0;
        color: #9c2e3d;
        font-size: 13px;
      }

      .form-note {
        margin: 22px 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .access-footer {
        min-height: 72px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .access-footer p { margin: 0; }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 780px) {
        .staticrypt-content { padding: 16px; }
        .staticrypt-page {
          padding: 58px 0 72px;
          grid-template-columns: 1fr;
          gap: 42px;
        }
        .context-copy h1 { font-size: clamp(2.8rem, 14vw, 4.6rem); }
        .staticrypt-form { padding: 34px 26px 30px; }
        .access-footer { align-items: flex-start; flex-direction: column; justify-content: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

      </main>

      <footer class="access-footer">
